# Фоновая рассылка пуш-уведомлений (вкладка «Уведомления» в кабинете учителя).
# Своего сервера у проекта нет — GitHub запускает notifier/send.mjs по
# расписанию. Для публичного репозитория это бесплатно.
#
# Нужен один секрет: Settings → Secrets and variables → Actions →
# New repository secret, имя FIREBASE_SERVICE_ACCOUNT, значение — весь JSON
# ключа сервисного аккаунта Firebase (см. README.md → «Уведомления»).
# Без секрета запуск проходит зелёным и ничего не шлёт.
#
# Основной запуск — снаружи: cron-job.org каждые 15 минут с 08:00 до 23:59
# по Москве (ночью рассылки нет) вызывает workflow_dispatch через GitHub API
# (см. README.md → «Уведомления»): своё расписание GitHub у малоактивных
# репозиториев запускает раз в несколько часов. Расписание ниже — запасное,
# в том же окне (время в UTC: 08:00–23:59 МСК = 05:00–20:59 UTC); дублей не
# будет (notifLog, concurrency). Напоминания и пуши учителю, выпавшие на ночь,
# приходят утром (окна 9 ч в notify-core.js и send.mjs).
#
# Квота Firestore (Spark: 50 000 чтений в сутки на весь проект) общая для
# рассылки и кабинетов. «RESOURCE_EXHAUSTED: Quota exceeded» в этом шаге —
# лимит кончился (см. DEVLOG, REVIEW.md), сбрасывается в 10:00 МСК.
#
# GitHub запускает расписание с задержкой до ~10–20 минут в часы нагрузки,
# а если в репозитории 60 дней нет коммитов — выключает его (включить
# обратно: вкладка Actions → «Уведомления» → Enable workflow).
name: Уведомления

on:
  schedule:
    - cron: "*/15 5-20 * * *"   # UTC = 08:00–23:59 МСК
  workflow_dispatch: {}

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - name: Установить firebase-admin
        run: npm ci --no-audit --no-fund
        working-directory: notifier
      - name: Разослать уведомления
        run: node send.mjs
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://tviitterggl-dev.github.io/tutor-dashboard/
