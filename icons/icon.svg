  <rect x="126" y="150" width="260" height="62" rx="30" fill="#C9A24B"/>
  <rect x="126" y="186" width="260" height="26" fill="#C9A24B"/>
  <rect x="176" y="124" width="24" height="56" rx="12" fill="#F7F5F0"/>
  <rect x="312" y="124" width="24" height="56" rx="12" fill="#F7F5F0"/>
